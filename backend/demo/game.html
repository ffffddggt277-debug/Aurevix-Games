<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurevix Demo</title><style>html,body{margin:0;height:100%;background:#070a15;color:#eef5ff;font:16px Arial}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:14px;padding:16px 20px;background:#0b1020;border-bottom:1px solid #293658}h1{font-size:18px;margin:0}button,select{background:#182643;color:#eef5ff;border:1px solid #41618e;border-radius:6px;padding:10px 14px;cursor:pointer}header span{margin-left:auto}canvas{display:block;width:100%;flex:1;min-height:0;touch-action:none}footer{padding:12px;text-align:center;color:#aabbda;font-size:13px}#msg{margin-left:0;font-size:12px}</style><header><h1 id="title"></h1><span id="score"></span><button id="reset"></button><select id="lang"><option value="ru">RU</option><option value="en">EN</option></select></header><canvas aria-label="Interactive demo game"></canvas><footer id="help"></footer><script>
const MODE=__MODE__,NAMES=__NAMES__;let lang='ru',score=0,tick=0,ship=.5,objects=[],over=false;let grid=Array.from({length:16},()=>Math.random()>.5?1:0),selected=[];
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=900,H=480;
const words={ru:{reset:'Заново',score:'Очки: ',help:['Собирай голубые звёзды. Двигай мышью, пальцем или стрелками.','Коснись плитки: она переключит соседей. Погаси все огни.','Лови падающие звёзды. Двигай мышью, пальцем или стрелками.','Найди пары одинаковых символов. Коснись двух плиток.','Уклоняйся от фиолетовых астероидов. Двигай мышью, пальцем или стрелками.','Собирай кристаллы и избегай астероидов.'],demo:'Демонстрация Aurevix'},en:{reset:'Restart',score:'Score: ',help:['Collect cyan stars. Use mouse, touch or arrow keys.','Tap a tile to toggle its neighbors. Turn off all lights.','Catch falling stars. Use mouse, touch or arrow keys.','Match identical symbols. Tap two tiles.','Dodge violet asteroids. Use mouse, touch or arrow keys.','Collect crystals and avoid asteroids.'],demo:'Aurevix demo'}};
function labels(){document.documentElement.lang=lang;document.querySelector('#title').textContent=NAMES[lang];document.querySelector('#reset').textContent=words[lang].reset;document.querySelector('#score').textContent=words[lang].score+score;document.querySelector('#help').textContent=words[lang].help[MODE]+' · '+words[lang].demo}
function reset(){score=0;objects=[];tick=0;ship=.5;over=false;selected=[];grid=MODE===3?[0,1,2,3,4,5,6,7,0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5):Array.from({length:16},()=>Math.random()>.5?1:0);labels()}
document.querySelector('#reset').onclick=reset;document.querySelector('#lang').onchange=e=>{lang=e.target.value;labels()};
function move(e){const r=c.getBoundingClientRect();ship=Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width));if(MODE===1||MODE===3){const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;const size=Math.min(W*.17,H*.18),left=W/2-size*2,top=H/2-size*2;const col=Math.floor((x-left)/size),row=Math.floor((y-top)/size);if(col<0||col>3||row<0||row>3)return;const i=row*4+col;if(MODE===1){for(const p of [i,row>0?i-4:-1,row<3?i+4:-1,col>0?i-1:-1,col<3?i+1:-1])if(p>=0)grid[p]=1-grid[p];score++;if(grid.every(x=>!x))over=true}else if(grid[i]!==-1&&!selected.includes(i)&&selected.length<2){selected.push(i);if(selected.length===2){setTimeout(()=>{if(grid[selected[0]]===grid[selected[1]]){grid[selected[0]]=grid[selected[1]]=-1;score+=10}selected=[];labels()},500)}}labels()}}
c.addEventListener('pointerdown',move);c.addEventListener('pointermove',e=>{if(MODE!==1&&MODE!==3)move(e)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){ship=Math.max(.03,ship-.06);e.preventDefault()}if(e.key==='ArrowRight'){ship=Math.min(.97,ship+.06);e.preventDefault()}});
function resize(){const r=c.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(220,r.height);c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resize);resize();reset();
let last=0;
function frame(time){const step=Math.min(2,(time-last)/16.67||1);last=time;tick+=step;ctx.fillStyle='#070a15';ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){const x=(i*137.7)%W,y=(i*87.1+tick*.25)%H;ctx.fillStyle=i%5===0?'#7c8fad':'#263955';ctx.fillRect(x,y,1.5,1.5)}
if(MODE===1||MODE===3){const size=Math.min(W*.17,H*.18),left=W/2-size*2,top=H/2-size*2;for(let i=0;i<16;i++){ctx.fillStyle=MODE===1?(grid[i]?'#7c4bea':'#18243b'):(grid[i]===-1?'#10222e':selected.includes(i)?'#258ca6':'#29335c');ctx.fillRect(left+(i%4)*size+5,top+Math.floor(i/4)*size+5,size-10,size-10);ctx.fillStyle='#d4edff';ctx.font='24px Arial';ctx.textAlign='center';if(MODE===3&&selected.includes(i))ctx.fillText(['✦','◈','☾','⬡','△','○','☆','◇'][grid[i]],left+(i%4)*size+size/2,top+Math.floor(i/4)*size+size/2+8)}if(over){ctx.fillStyle='#a7f6df';ctx.font='24px Arial';ctx.fillText(lang==='ru'?'Отлично! Все огни погашены':'Great! All lights are off',W/2,H-30)}}else{
if(Math.floor(tick/35)!==Math.floor((tick-step)/35))objects.push({x:Math.random()*W,y:-20,good:MODE===4?false:Math.random()>.25});for(const o of objects){o.y+=(2+tick/1800)*step;ctx.beginPath();ctx.arc(o.x,o.y,o.good?7:13,0,Math.PI*2);ctx.fillStyle=o.good?'#38bdf8':'#8b5cf6';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;if(Math.abs(o.x-ship*W)<24&&Math.abs(o.y-(H-45))<24){score+=o.good?10:-5;o.y=H+50;labels()}}objects=objects.filter(o=>o.y<H+40);ctx.fillStyle='#dbeafe';ctx.beginPath();ctx.moveTo(ship*W,H-68);ctx.lineTo(ship*W-17,H-32);ctx.lineTo(ship*W,H-40);ctx.lineTo(ship*W+17,H-32);ctx.closePath();ctx.fill();ctx.fillStyle='#38bdf8';ctx.fillRect(ship*W-3,H-34,6,12);if(MODE===4&&Math.floor(tick/60)!==Math.floor((tick-step)/60)){score++;labels()}}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
